# Pembahasan tipe soal Part B dan C.
group_types:
  main_topic:
    konsep: "topik utama, yaitu hal yang dibahas dari awal hingga akhir"
    cara_cepat: "Perhatikan kalimat-kalimat awal, karena topik biasanya diperkenalkan di sana, lalu pastikan topik itu bertahan sampai akhir. Coret opsi yang hanya disebut sekilas atau terlalu sempit."
  detail:
    konsep: "informasi yang disebut secara langsung oleh pembicara"
    cara_cepat: "Pertanyaan baru terdengar setelah audio selesai, jadi biasakan mencatat singkat nama, alasan, dan angka saat mendengarkan. Pilih opsi yang memparafrasekan informasi yang terdengar, dan waspadai opsi yang memakai kata yang sama tetapi maknanya berbeda."
  inference:
    konsep: "kesimpulan, yaitu hal yang tersirat atau rencana yang tidak dinyatakan langsung oleh pembicara"
    cara_cepat: "Gabungkan beberapa informasi yang terdengar, lalu tanyakan kesimpulan apa yang pasti didukung olehnya. Hindari opsi yang hanya benar menurut pengetahuan umum tetapi tidak disebut pembicara."
